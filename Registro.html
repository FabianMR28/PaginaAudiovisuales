<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CamPro - Registro</title>
        <link href="CSS/LoginRegister.css" rel="stylesheet" type="text/css"/>
    </head>
    <body>
        <header>
            <a href="index.html">
                <img src="Imagenes/Banners/Logo final.png" width="140" alt=""/>
            </a>            
        </header>
        
        <div class="register-container">
            <h2>Crear Cuenta</h2>
            <form>
                <div class="form-group">
                    <label for="email">Nombres</label>
                    <input type="nombres" id="nombres" name="nombres" required>
                </div>
                <div class="form-group">
                    <label for="email">Apellidos</label>
                    <input type="apellidos" id="apellidos" name="apellidos" required>
                </div>    
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" minlength="8" required>
                </div>
                <button type="submit" class="register-button">Registrarse</button>
            </form>
            <div class="login-link">
                ¿Ya tienes una cuenta? <a href="Login.html">Inicia sesión aquí</a>
            </div>
        </div>
        
        <footer>
            <div class="footer-links">
                <a href="politica-privacidad.html">Política de privacidad</a>
                <a href="terminos.html">Términos y condiciones</a>
                <a href="soporte.html">Soporte técnico</a>
            </div>
            <p>© 2025 CamPro. Todos los derechos reservados.</p>
        </footer>
        
        <script src="JS/IngresoUsuarios.js" type="text/javascript"></script>
        
    </body>
</html>
